[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repict"
version = "0.2.0"
description = "A simple tool to convert images between formats via CLI or Web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.3.0",
    "Flask>=2.0.0",
    "werkzeug>=2.0.0",
    "python-dotenv>=1.0.0",
    "pillow-heif>=1.3.0",
]

[project.scripts]
repict = "repict.cli:run_cli"
repict-web = "repict.web.app:run_web"

[tool.setuptools.packages.find]
where = ["src"]
